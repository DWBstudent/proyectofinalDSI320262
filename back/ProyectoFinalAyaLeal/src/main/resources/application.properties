spring.application.name=ProyectoFinalAyaLeal

#Datos de conexiion y contraseNas: va en secrets.properties , esto no se sube al git
spring.config.import=optional:classpath:secrets.properties

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#para las colunas se llaman igual que los atributos
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


server.port=8080

#Sql en consola para pruebas
#Spring.jpa-show-sql=true


#Swagger
springdoc.swagger-ui.path=/
springdoc.swagger-ui.docExpansion= none
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter= true
springdoc.swagger-ui.tryItOutEnabled= true
